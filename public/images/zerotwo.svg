<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7da7" />
      <stop offset="60%" stop-color="#ff3377" />
      <stop offset="100%" stop-color="#e6004c" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5f0" />
      <stop offset="100%" stop-color="#ffe8de" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05d9e8" />
      <stop offset="100%" stop-color="#008080" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cc0033" />
      <stop offset="60%" stop-color="#990026" />
      <stop offset="100%" stop-color="#4d0013" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background circle -->
  <circle cx="200" cy="200" r="185" fill="#180a1c" stroke="#ff3377" stroke-width="3" stroke-opacity="0.5" filter="url(#neonGlow)"/>

  <!-- FranXX Pilot Uniform / Collar -->
  <path d="M120,380 Q130,280 180,265 L200,290 L220,265 Q270,280 280,380 Z" fill="url(#suitGrad)" stroke="#ff3377" stroke-width="2" />
  <path d="M185,275 L200,295 L215,275 L200,340 Z" fill="#ffffff" />
  <circle cx="200" cy="315" r="5" fill="#ff3377" />

  <!-- Long Flowing Pink Hair (Back) -->
  <path d="M100,160 Q80,260 90,360 Q130,370 145,280 Q110,210 120,160 Z" fill="url(#hairGrad)" />
  <path d="M300,160 Q320,260 310,360 Q270,370 255,280 Q290,210 280,160 Z" fill="url(#hairGrad)" />

  <!-- Neck -->
  <path d="M180,220 L180,270 Q200,280 220,270 L220,220 Z" fill="url(#skinGrad)" />

  <!-- Face / Head -->
  <path d="M140,150 Q140,230 200,250 Q260,230 260,150 Q260,95 200,95 Q140,95 140,150 Z" fill="url(#skinGrad)" />

  <!-- Zero Two Red Horns (Iconic) -->
  <path d="M165,108 Q160,65 172,50 Q176,68 174,105 Z" fill="#ff1a40" filter="url(#neonGlow)" />
  <path d="M235,108 Q240,65 228,50 Q224,68 226,105 Z" fill="#ff1a40" filter="url(#neonGlow)" />

  <!-- Red Eye Liner / Markings -->
  <path d="M152,165 Q165,155 182,164 Q172,175 152,165 Z" fill="#ff1a40" />
  <path d="M248,165 Q235,155 218,164 Q228,175 248,165 Z" fill="#ff1a40" />

  <!-- Eyes (Turquoise / Green) -->
  <ellipse cx="170" cy="166" rx="10" ry="11" fill="url(#eyeGrad)" />
  <ellipse cx="230" cy="166" rx="10" ry="11" fill="url(#eyeGrad)" />
  <circle cx="168" cy="163" r="3" fill="#ffffff" />
  <circle cx="228" cy="163" r="3" fill="#ffffff" />

  <!-- Eyelashes & Brows -->
  <path d="M155,158 Q170,148 185,160" stroke="#4a1525" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M245,158 Q230,148 215,160" stroke="#4a1525" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Nose -->
  <path d="M198,185 Q200,190 196,193" stroke="#e0b0a0" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Confident Smile / Lollipop -->
  <path d="M188,212 Q200,222 214,210" stroke="#c04060" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Hair Bangs (Front) -->
  <path d="M135,140 Q160,85 200,85 Q240,85 265,140 Q255,180 248,220 Q240,160 220,135 Q200,170 190,140 Q170,180 152,135 Q145,175 135,140 Z" fill="url(#hairGrad)" />

  <!-- White Headband -->
  <path d="M152,112 Q200,102 248,112" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.9" />

  <!-- Honey / Sweet Lollipop Accent -->
  <circle cx="218" cy="216" r="6" fill="#ffaa00" />
  <line x1="218" y1="216" x2="235" y2="236" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- Glowing FranXX 002 code mark -->
  <text x="200" y="380" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#ff3377" text-anchor="middle" letter-spacing="4">CODE: 002</text>
</svg>
